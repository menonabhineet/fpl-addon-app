<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Premier League Royal Purple to Deep Night -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38003c" />
      <stop offset="60%" stop-color="#220026" />
      <stop offset="100%" stop-color="#0e0010" />
    </linearGradient>

    <!-- Ball 3D Shading Radial Gradient -->
    <radialGradient id="ballShading" cx="34%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f8fafc" />
      <stop offset="75%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </radialGradient>

    <!-- Dark Leather Patch Gradient with subtle purple/carbon sheen -->
    <linearGradient id="patchGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#2d133b" />
      <stop offset="40%" stop-color="#190924" />
      <stop offset="100%" stop-color="#0a0310" />
    </linearGradient>

    <!-- FPL Cyan/Green Glow Ring -->
    <linearGradient id="fplRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff87" />
      <stop offset="50%" stop-color="#02efff" />
      <stop offset="100%" stop-color="#9d4edd" />
    </linearGradient>

    <!-- Ball Outer Drop Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Inner Ball Clip -->
    <clipPath id="ballClip">
      <circle cx="32" cy="32" r="23.5" />
    </clipPath>
  </defs>

  
  <!-- Squircle App Badge Container -->
  <rect width="64" height="64" rx="15" fill="url(#bgGrad)" />
  
  <!-- Subtle Neon Accent Border -->
  <rect width="60" height="60" x="2" y="2" rx="13" fill="none" stroke="url(#fplRing)" stroke-width="1.5" stroke-opacity="0.8" />
  

  <!-- Soccer Ball -->
  <g filter="url(#dropShadow)">
    <!-- Base Sphere -->
    <circle cx="32" cy="32" r="23.5" fill="url(#ballShading)" stroke="#0f172a" stroke-width="0.8" />

    <!-- Ball Features (Clipped to Sphere) -->
    <g clip-path="url(#ballClip)">
      <!-- Seam lines connecting patches -->
      <g stroke="#334155" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <!-- Rays from central pentagon to seam nodes -->
        <line x1="32.0" y1="23.5" x2="32.0" y2="16.5" />
        <line x1="40.1" y1="29.4" x2="46.7" y2="27.2" />
        <line x1="37.0" y1="38.9" x2="41.1" y2="44.5" />
        <line x1="27.0" y1="38.9" x2="22.9" y2="44.5" />
        <line x1="23.9" y1="29.4" x2="17.3" y2="27.2" />

        <!-- Outer seam branches -->
        <line x1="32.0" y1="16.5" x2="42.3" y2="17.8" />
        <line x1="32.0" y1="16.5" x2="21.7" y2="17.8" />
        <line x1="46.7" y1="27.2" x2="42.3" y2="17.8" />
        <line x1="46.7" y1="27.2" x2="48.6" y2="37.4" />
        <line x1="41.1" y1="44.5" x2="48.6" y2="37.4" />
        <line x1="41.1" y1="44.5" x2="32.0" y2="49.5" />
        <line x1="22.9" y1="44.5" x2="32.0" y2="49.5" />
        <line x1="22.9" y1="44.5" x2="15.4" y2="37.4" />
        <line x1="17.3" y1="27.2" x2="15.4" y2="37.4" />
        <line x1="17.3" y1="27.2" x2="21.7" y2="17.8" />

        <!-- Perimeter connections -->
        <line x1="32.0" y1="16.5" x2="32.0" y2="8.0" />
        <line x1="46.7" y1="27.2" x2="55.0" y2="24.0" />
        <line x1="41.1" y1="44.5" x2="46.5" y2="52.5" />
        <line x1="22.9" y1="44.5" x2="17.5" y2="52.5" />
        <line x1="17.3" y1="27.2" x2="9.0" y2="24.0" />
      </g>

      <!-- Center Pentagon -->
      <polygon points="32.0,23.5 40.1,29.4 37.0,38.9 27.0,38.9 23.9,29.4"
               fill="url(#patchGrad)" stroke="#090d16" stroke-width="1.2" stroke-linejoin="round" />

      <!-- Top-Right Outer Patch -->
      <polygon points="42.3,17.8 32.0,16.5 32.0,7.0 46.0,8.5 55.0,24.0 46.7,27.2"
               fill="url(#patchGrad)" stroke="#090d16" stroke-width="1.2" stroke-linejoin="round" />

      <!-- Bottom-Right Outer Patch -->
      <polygon points="48.6,37.4 46.7,27.2 55.0,24.0 57.0,38.0 46.5,52.5 41.1,44.5"
               fill="url(#patchGrad)" stroke="#090d16" stroke-width="1.2" stroke-linejoin="round" />

      <!-- Bottom Outer Patch -->
      <polygon points="32.0,49.5 41.1,44.5 46.5,52.5 32.0,57.0 17.5,52.5 22.9,44.5"
               fill="url(#patchGrad)" stroke="#090d16" stroke-width="1.2" stroke-linejoin="round" />

      <!-- Bottom-Left Outer Patch -->
      <polygon points="15.4,37.4 22.9,44.5 17.5,52.5 7.0,38.0 9.0,24.0 17.3,27.2"
               fill="url(#patchGrad)" stroke="#090d16" stroke-width="1.2" stroke-linejoin="round" />

      <!-- Top-Left Outer Patch -->
      <polygon points="21.7,17.8 17.3,27.2 9.0,24.0 18.0,8.5 32.0,7.0 32.0,16.5"
               fill="url(#patchGrad)" stroke="#090d16" stroke-width="1.2" stroke-linejoin="round" />

      <!-- Glossy 3D Light Highlight curve -->
      <ellipse cx="26" cy="21" rx="11" ry="6" fill="#ffffff" fill-opacity="0.22" transform="rotate(-30 26 21)" />
      <!-- Small specular dot -->
      <circle cx="23" cy="18" r="2" fill="#ffffff" fill-opacity="0.45" />
    </g>
  </g>

  
  <!-- Top Right Mini Neon Star / Badge Sparkle -->
  <path d="M51,8.5 L52.2,11.5 L55.2,12.7 L52.2,13.9 L51,16.9 L49.8,13.9 L46.8,12.7 L49.8,11.5 Z" fill="#00ff87" opacity="0.95" />
  
</svg>